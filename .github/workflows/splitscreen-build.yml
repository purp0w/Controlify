name: Splitscreen Build

on:
  push:
    branches:
      - 'ci/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: microsoft
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x ./gradlew
      - name: Build splitscreen subproject
        run: ./gradlew :splitscreen:1.21.11-fabric:build --stacktrace
      - name: List jars
        if: always()
        run: find . -path '*/build/libs/*' -name '*.jar' -printf '%p %s\n'
      - uses: actions/upload-artifact@v4
        with:
          name: controlify-splitscreen
          path: splitscreen/**/build/libs/*.jar
          if-no-files-found: error